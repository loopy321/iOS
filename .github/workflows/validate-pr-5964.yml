name: Validate PR 5964

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
  BEFORE_SHA: 4ae875d545552603504b8242b2ad5b270bd24056
  AFTER_SHA: 00a1d209cc1ddf2c6943950148e4430df90771d3

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      home-assistant-version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve stable Home Assistant version
        id: version
        run: |
          VERSION=$(curl -fsS https://pypi.org/pypi/homeassistant/json | jq -r .info.version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Testing against Home Assistant $VERSION"

  validate:
    needs: prepare
    name: ${{ matrix.variant }} (${{ matrix.sha }})
    runs-on: xcode-27
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: before
            sha: 4ae875d545552603504b8242b2ad5b270bd24056
          - variant: after
            sha: 00a1d209cc1ddf2c6943950148e4430df90771d3
    steps:
      - name: Check out validation harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: validation
          persist-credentials: false

      - name: Check out exact test revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: loopy321/iOS
          ref: ${{ matrix.sha }}
          path: source
          persist-credentials: false

      - name: Add temporary UI-test harness
        run: python3 validation/.github/validation-pr-5964/setup_harness.py source

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5.3.0
        with:
          python-version: ">=3.14.2 <3.15"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        name: Restore DerivedData
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: pr-5964-v2-${{ matrix.sha }}-${{ hashFiles('source/Package.resolved') }}
          restore-keys: pr-5964-

      - name: Build, test, and record cold launch
        run: |
          bash validation/.github/validation-pr-5964/run_variant.sh \
            "$GITHUB_WORKSPACE/source" \
            "${{ matrix.variant }}" \
            "${{ matrix.sha }}" \
            "${{ needs.prepare.outputs.home-assistant-version }}" \
            "$RUNNER_TEMP/pr5964"

      - name: Upload variant evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pr-5964-validation-${{ matrix.variant }}
          path: ${{ runner.temp }}/pr5964
          if-no-files-found: warn
          retention-days: 14

  aggregate:
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check out validation harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: validation
          persist-credentials: false

      - name: Download variant evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: pr-5964-validation-*
          path: evidence
          merge-multiple: true

      - name: Generate validation summary
        run: |
          python3 validation/.github/validation-pr-5964/aggregate.py \
            evidence "$BEFORE_SHA" "$AFTER_SHA" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload combined evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pr-5964-validation
          path: evidence
          if-no-files-found: error
          retention-days: 14
